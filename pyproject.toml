[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1race"
version = "0.1.0"
description = "Layered study of minimum-lap-time racing: from deterministic planning to control under uncertainty and reinforcement learning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "casadi>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
rl = ["torch>=2.2", "stable-baselines3>=2.3", "gymnasium>=0.29"]   # L5 only

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: optimisation-based tests (tens of seconds)"]
