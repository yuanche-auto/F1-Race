y="344.0" r="7" fill="#eb6834"/><text x="836" y="349.0" fill="#0b0b0b" font-size="13" font-variant-numeric="tabular-nums">102 → <tspan font-weight="700">51</tspan><tspan fill="#6b6a65"> / 105</tspan></text><title>L7: RL 策略本身 102/105 → + NMPC 滤波 51/105</title><rect x="16" y="366" width="968" height="36" rx="6" fill="#f3f2ee" opacity="1"/><text x="24" y="382.0" fill="#0b0b0b" font-size="13.5" font-weight="700">L8</text><text x="92" y="381.0" fill="#0b0b0b" font-size="13">4 条新赛道</text><text x="92" y="397.0" fill="#6b6a65" font-size="11.5">NMPC，名义模型 → 辨识 + 重规划</text><line x1="605.8" y1="384.0" x2="820.0" y2="384.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" opacity="0.45"/><circle cx="605.8" cy="384.0" r="6" fill="#9a9893"/><circle cx="820.0" cy="384.0" r="7" fill="#2a78d6"/><text x="836" y="389.0" fill="#0b0b0b" font-size="13" font-variant-numeric="tabular-nums">49 → <tspan font-weight="700">100</tspan><tspan fill="#6b6a65"> / 100</tspan></text><title>L8: NMPC，名义模型 49/100 → 辨识 + 重规划 100/100</title><rect x="16" y="406" width="968" height="36" rx="6" fill="#f3f2ee" opacity="0.0"/><text x="24" y="422.0" fill="#0b0b0b" font-size="13.5" font-weight="700">L9</text><text x="92" y="421.0" fill="#0b0b0b" font-size="13">实时 50 ms</text><text x="92" y="437.0" fill="#6b6a65" font-size="11.5">NMPC，IPOPT → acados RTI</text><line x1="400.0" y1="424.0" x2="716.0" y2="424.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" opacity="0.45"/><circle cx="400.0" cy="424.0" r="6" fill="#9a9893"/><circle cx="716.0" cy="424.0" r="7" fill="#2a78d6"/><text x="836" y="429.0" fill="#0b0b0b" font-size="13" font-variant-numeric="tabular-nums">0 → <tspan font-weight="700">79</tspan><tspan fill="#6b6a65"> / 105</tspan></text><title>L9: NMPC，IPOPT 0/105 → acados RTI 79/105</title><text x="24" y="462" fill="#0b0b0b" font-size="14" font-weight="700">控制扩展（有基准测试的阶段）</text><rect x="16" y="476" width="968" height="36" rx="6" fill="#f3f2ee" opacity="1"/><text x="24" y="492.0" fill="#0b0b0